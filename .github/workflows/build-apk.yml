name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build with Gradle
        run: |
          # x86_64 CI 环境不需要 ARM64 的 aapt2 override
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon

      - name: Rename APK with version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "deepseekharness-arm64-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseekharness-arm64
          path: deepseekharness-arm64-*.apk

      - name: Generate changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: changelog
        run: |
          # 取上一个 tag 到 HEAD 的 commit，没有 tag 就取最近 10 条
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "${PREV_TAG}..HEAD" --no-merges)
          else
            LOG=$(git log --oneline -10 --no-merges)
          fi
          # 写入多行 output
          {
            echo "log<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DSHA v${{ steps.version.outputs.version }}
          body: |
            ## DSHA v${{ steps.version.outputs.version }}

            ### 更新内容
            ${{ steps.changelog.outputs.log }}

            ### 安装
            下载下方 `deepseekharness-arm64-v${{ steps.version.outputs.version }}.apk`，覆盖安装即可。
          files: deepseekharness-arm64-*.apk
          draft: false
          prerelease: false
          make_latest: true
